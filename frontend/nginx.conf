server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không phải file tĩnh đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset có hash (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
